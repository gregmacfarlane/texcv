ce-662:
  code: CE 662
  name: Transport Simulation and Analysis
  description: An advanced graduate course in traffic flow theory and simulation. Topics include shock wave analysis, discrete event simulation of queues and daily activity pattern choices, car following models, and traffic simulation. Laboratory assignments use MATSim and PTV Vissim simulation software.
  offerings:
    - {term: Winter 2019, enrolled: 2, rating: "4.6 (4.3)", gpa: "3.70"}
    - {term: Winter 2020, enrolled: 3, rating: "5.0–5.0 (4.4)", gpa: "3.00"}
    - {term: Winter 2022, enrolled: 7, rating: "3.3–5.0 (4.3)", gpa: "3.44"}
    - {term: Fall 2023, enrolled: 8, rating: "4.1–5.0 (4.4)", gpa: "3.48"}
ce-694r:
  code: CE 694R
  name: Advanced Choice Modeling
  description: An advanced graduate course in discrete choice modeling. Theory of choice models, including estimation and validation techniques. Mode choice models for work and non-work trip purposes using multinomial and nested logit models.
  offerings:
    - {term: Winter 2021, enrolled: 5, rating: "4.0–5.0", gpa: "3.48"}
