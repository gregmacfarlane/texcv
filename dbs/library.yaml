- id: macfarlaneInfluencesPresentResidential2015
  abstract: >-
    This study explores the relationship between historical exposure to the
    built environment and current vehicle ownership patterns. The influence of
    past exposure to the built environment on current vehicle ownership
    decisions may be causal, but there are alternative explanations. Households
    may primarily select to live in neighborhoods that facilitate their vehicle
    ownership preferences, or they may retain preferences that they have
    developed in the past, irrespective of their current situations. This study
    seeks to control for these alternative explanations by including the built
    environment attributes of households’ past residences as an influence on
    vehicle ownership choices. We use a dataset from a credit reporting firm
    that contains up to nine previous residential ZIP codes for households
    currently living in the 13-county Atlanta, Georgia, metropolitan area.
    Results show that past location is significant, but of marginal influence
    relative to the attributes of the current location. From a practical
    perspective, our results suggest that models that include current but not
    past neighborhood attributes (also controlling for standard socioeconomic
    variables) can forecast vehicle ownership decisions reasonably well.
    However, models that include both current and past neighborhood attributes
    can provide a more nuanced understanding of the built environment’s
    potentially causal influences on vehicle ownership decisions. This better
    understanding may provide more realistic forecasts of responses to
    densification or other travel demand management strategies.
