- id: schultzAnalysisBenefitsUDOTs2023
  abstract: >-
    In 2019, the Utah Department of Transportation (UDOT) funded a research
    study evaluating the performance measures of UDOT’s expanded Incident
    Management Team (IMT) program. The number of IMTs patrolling Utah roadways
    increased from 13 to 25 between 2018 and 2020. Crash data were collected
    from the Utah Highway Patrol’s Computer Aided Dispatch database and from the
    UDOT TransSuite database to compare IMT performance measures between the two
    years and to evaluate the benefits of the expanded IMT program. However,
    these data were compromised due to the effects of the COVID-19 pandemic.
    This study collected data for 2022 using the same methodology as the Phase
    II study to compare IMT performance measures in 2022 with those of 2018
    after traffic volumes had returned to a similar level as those of
    pre-pandemic levels. There were 283 and 307 incidents for the years of 2018
    and 2022, respectively, that were analyzed for IMT performance measures
    which include response time, roadway clearance time, and incident clearance
    time. There were 172 and 236 incidents for the years of 2018 and 2022,
    respectively, that were analyzed for the user impact categories of affected
    volume, excess travel time, and excess user costs. Results of the
    statistical analyses conducted on the 2018 and 2022 datasets show that IMTs
    can respond more quickly to incidents in a larger coverage area with
    significantly reduced user impacts. The expanded IMT program is also able to
    respond to more incidents, including those of high severity, while
    significantly decreasing congestion.
