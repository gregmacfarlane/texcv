- id: gibbonsEvaluatingImpactsParameter2025
  abstract: >-
    The inherent uncertainty in travel forecasting models—arising from potential
    and unknown errors in input data, parameter estimation, or model
    formulation—is receiving increasing attention from both the scholarly and
    practicing communities. In this research, we investigate the variance in
    forecasted traffic volumes resulting from varying the mode and destination
    choice parameters in an advanced trip-based travel demand model. Using Latin
    hypercube sampling to construct several hundred combinations of parameters
    across the plausible parameter space, we introduce substantial changes to
    implied travel impedances and modal utilities, on the order of a 10 percent
    variation. However, the aggregate effects of these changes on forecasted
    traffic volumes are small, with a variation of approximately 1 percent on
    high-volume facilities. It is likely that in this example—and perhaps in
    others—the network assignment places constraints on the possible volume
    solutions and limits the practical impacts of parameter uncertainty.
    Nevertheless, parameter uncertainty may not be the largest contributor to
    error in practical travel forecasts. Further research should examine the
    robustness of this finding across other less constrained networks and within
    activity-based travel model frameworks.
