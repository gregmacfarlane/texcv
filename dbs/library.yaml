- id: macfarlaneHowFarAre2023
  abstract: >-
    The mobility needs of individuals with travel-limiting disabilities has been
    a transportation policy priority in the United States for more than thirty
    years, but efforts to model the behavioral implications of disability on
    travel have been limited. In this research, we present a daily activity
    pattern choice model for multiple person type segments including an
    individual’s wheelchair use as an explanatory variable. The model results
    show a strong negative impact of wheelchair use on out-of-home travel,
    exceeding the impact of other variables commonly considered in such models.
    We then apply the estimated model within an activity-based model for the
    Wasatch Front region in Utah; the results suggest a shift in tour making of
    sufficient scale—among both wheelchair users and those in their
    households—to warrant further scrutiny and analysis.
