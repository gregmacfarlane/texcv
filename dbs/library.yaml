- id: guanTSCOREProjectM1MultiModal2023
  abstract: >-
    Over the last decades, urban areas have experienced sustained population
    growth, which has transformed into a significant increase in personally
    owned vehicles. Investment in public transit is often expected to make
    positive impacts on traffic congestion and air quality. Despite the fact
    that efficient systems such as light rail and Bus Rapid Transit (BRT) are
    developed in large cities, one of the main challenges facing transit
    agencies is the first mile and last-mile problem. On- Demand Multimodal
    Transit Systems (ODMTS) are transit systems that tightly integrate fixed
    transit routes and on-demand shuttles (Arthur et al., 2019; Auad et al.,
    2021). The fixed routes usually consist of rail lines and bus lines that
    provide high frequency services on key corridors, providing economy of scale
    and addressing congestion issues. On-demand shuttles are employed to
    overcome the first mile and last-mile problem. The shuttles generally serve
    local demand by delivering passengers from/to trip origins/destinations
    to/from nearby hubs. This project explores the viabilities of integrating
    the ODMTS concept with a highly developed citywide transit system. In
    particular, the project first extends the optimization framework proposed by
    Dalmeijer and Van Hentenryck (2020) by introducing novel features such as
    walking transfer and weighted travel time. This project then considers two
    systematic case studies conducted in San Francisco and Salt Lake City with
    data simulated by the microsimulation platform BEAM. These two case studies
    are unique to their counterparts since all origin-destinations pairs are
    residential locations or points of interests, instead of transit stops.
    Together, the new features and the case studies provide more realistic
    assumptions and lead to interesting computational results. The results
    demonstrate how to seamlessly integrate the ODMTS concept to extend an
    existing transit network to address the first mile and last-mile problem and
    provide a reduced overall operating cost and passenger travel time.
