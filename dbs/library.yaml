- id: macfarlaneIdentifyingMicrotransitService2023
  abstract: >-
    Demand-responsive microtransit services have operated in Utah since a pilot
    program debuted in Fall 2019. The Utah Transit Authority (UTA) and its
    partners see such services as providing key mobility in transit-limited
    areas, but how to prioritize which areas receive such services is an open
    question. In this research, we present a multi-agent daily activity
    simulation of regional travel demand in the Wasatch Front– using the
    open-source BEAM simulation developed by Lawrence Berkeley National
    Laboratory – including on-demand microtransit services. Though unresolved
    methodological limitations surrounding sample size and choice methodology
    exist, the simulation we develop successfully replicates key indicators of
    the pilot program including ridership and utilization. An analysis of
    additional prospective deployment areas suggests that all proposed areas
    would be successful at the current level of investment. UTA and its partners
    should prioritize regions that enhance the ability to build multi-modal
    travel paths and focus on automobile-limited households to maximize system
    use.
