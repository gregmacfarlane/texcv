- id: macfarlaneSimulatingIncidentManagement2024
  abstract: >-
    The effectiveness of Incident Management Teams (IMT) in reducing the
    duration and impact of traffic incidents is well documented. The capacity of
    large-scale simulation models to illustrate the negative effects of these
    incidents on vehicle delays and excess user costs (EUC) is also widely
    recognized. However, there is a gap in research integrating large-scale
    simulation modeling with IMT performance analysis. This study uses the
    Multi-Agent Transport Simulation (MATSim) framework to simulate the impact
    of incidents and evaluate the performance of IMT across the regional network
    of Utah’s Wasatch Front, analyzing their operation in various hypothetical
    situations. Our findings validate the role of IMT in decreasing delays and
    EUC. The simulation also investigates the potential effects of increased
    incident frequency and IMT expansion, revealing that more incidents
    increased delays, whereas additional IMT units can mitigate these effects
    and improve response times. The MATSim model we developed demonstrates the
    potential of dynamic large-scale modeling to evaluate incident management
    strategies in ways that previous studies did not. This model could serve as
    a valuable tool for further evaluating the performance of Utah’s IMT
    program, with the potential to offer new perspectives on optimizing team
    deployment and scheduling efficiency.
