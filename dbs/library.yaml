- id: macfarlaneEffectTransitSignal2021
  abstract: >-
    We report the results of an experiment to evaluate the impact of transit
    signal priority (TSP) on headway adherence for a bus rapid transit (BRT)
    system in Provo / Orem, Utah. The bus requests TSP based on its unpublished
    schedule, but users perceive only a headway. Quantile regression models
    estimated on raw timepoint data from the BRT system reveal that TSP
    significantly improves headway adherence, after controlling for peak times,
    direction, and cumulative trip dwell time. We also find that requiring the
    bus to be 2 minutes late before requesting TSP improves headway adherence
    more than allowing all buses to request TSP.
