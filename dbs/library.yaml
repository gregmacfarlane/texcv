- id: wangEvaluatingSignalSystems2022
  abstract: >-
    Automated traffic signal performance measures (ATSPMs) are used to collect
    data concerning the current and historical performance of signalized
    intersections. However, transportation agencies are not using ATSPM data to
    the full extent of this “big data” resource, because the volume of
    information can overwhelm traditional identification and prioritization
    techniques. This paper presents a method that summarizes multiple dimensions
    of intersection- and corridor-level performance using ATSPM data and returns
    information that can be used for prioritization of intersections and
    corridors for further analysis. The method was developed and applied to
    analyze three signalized corridors in Utah, consisting of 20 total
    intersections. Four performance measures were used to develop threshold
    values for evaluation: platoon ratio, split failures, arrivals on green, and
    red-light violations. The performance measures were scaled and classified
    using k-means cluster analysis and expert input. The results of this
    analysis produced a score for each intersection and corridor determined from
    the average of the four measures, weighted by expert input. The methodology
    is presented as a prototype that can be developed with more performance
    measures and more extensive corridors for future studies.
