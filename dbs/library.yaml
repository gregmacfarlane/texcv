- id: wallExploringUseEgocentric2014
  abstract: >-
    The rapid growth of online social networking over the past decade has
    generated substantial amounts of data about individuals and their social
    relationships. Recent research studies investigating social relationships
    and travel behavior have sought connections between individuals’ social
    networks and socially related travel; however, to the authors’ knowledge, no
    study has pursued the use of online social networking data to do so. This
    study explores the use of online social network data in characterizing
    individuals’ air travel behavior. Data were collected through a web-based
    survey including information about individuals’ air travel history and
    online social network information, specifically participants’ Facebook
    networks. The data were then analyzed to address a series of hypotheses
    about the association between online social network characteristics
    (specifically Facebook) and air travel behavior, in particular, travel
    distance, leisure-related travel, and trip generation. This study found a
    positive relationship between the size and distribution of individuals’
    Facebook social networks and both their engagement in air travel and the
    odds that their air travel will be leisure related or will include a leisure
    component.
