- id: binderAssociationsHouseholdCharacteristics2014
  abstract: >-
    Many U.S. cities use vehicle emissions testing programs to improve air
    quality by identifying gross polluting vehicles and requiring their owners
    to make emissions-related repairs. All vehicles that meet certain criteria
    must pass an emissions test as part of the vehicle registration process.
    States use different criteria to determine which vehicles must be tested;
    however, the equity impacts associated with various screening criteria are
    unknown. This is due to difficulties researchers have faced in linking
    vehicle and household characteristics. We investigate the relative influence
    of vehicle and household characteristics on emissions failures in Atlanta,
    Georgia, by linking its emissions testing database to a targeted marketing
    database; the latter contains information about vehicle owners. We use count
    and hurdle models to predict vehicle emissions failures. Our model finds a
    relationship between sociodemographic characteristics and emissions failures
    after controlling for vehicle characteristics; that is, given two identical
    vehicles, the one owned by a low-income or minority household is more likely
    to fail emissions. We use our model to investigate the impacts of different
    emissions testing policies by income and ethnic groups.
