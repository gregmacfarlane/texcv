- id: macfarlaneIdentifyingRidehailRiders2026
  abstract: >-
    The advent of on-demand transport modes such as ride-hailing and
    microtransit has challenged forecasters to develop new methods of
    forecasting the use and impacts of such modes. In particular, there is some
    professional disagreement about the relative role of activity-based
    transportation behavior models — which have detailed understanding of the
    person making a trip and its purpose — and multi-agent demand simulations
    which may have a better understanding of the availability and service
    characteristics of on-demand services. A particular question surrounds how
    the relative strengths of these two approaches might be successfully paired
    in practice. Using daily plans generated by the activity-based model
    ActivitySim as inputs to the BEAM multi-agent simulation, we construct nine
    different methodological combinations by allowing the choice to use a pooled
    ride-hail service in ActivitySim, in BEAM with different utility functions,
    or in both. Within each combination, we estimate ride-hailing ridership and
    level of service measures. The results suggest that mode choice model
    structure drastically affects ride-hailing ridership and level of service.
    In addition, we see that multi-agent simulation overstates the demand
    interest relative to an activity-based model, but there may be opportunities
    in future research to implement feedback loops to balance the ridership and
    level of service forecasts between the two models.
