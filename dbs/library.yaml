- id: voulgarisYoullNeverWalk2025
  abstract: >-
    Introduction:

    Active travel can contribute to children meeting recommended levels of
    physical activity. Independent travel may also increase children’s mental
    and emotional health by increasing feelings of autonomy. The purpose of this
    study is to determine (1) what predicts households’ joint choice of mode and
    parental escorting for the journey to school, and (2) how the structure of
    this joint choice is best described.

    Methods:

    Using data from the 2009 and 2017 National Household Travel Surveys in the
    United States, we estimated several discrete choice models jointly
    predicting the choice of mode and escorting. We tested alternative model
    structures representing mode-escorting combinations as independent
    alternatives, nested alternatives, or cross-nested alternatives.

    Results:

    The cross-nested model structure best fits the data. The cross-nested model
    is consistent with the conception of escorted active travel as a compromise
    between motorized travel and unescorted active travel. Lower vehicle access,
    a later survey year, and the presence of a nonworking mother in the
    household are associated with lower utility of both motorized travel and
    unescorted active travel, relative to escorted active travel.

    Conclusions:

    While the physical activity benefits of active travel are available
    regardless of parental escorting, additional mental and emotional health
    benefits may come when travel is both active and independent. Since there is
    less substitution from motorized travel to unescorted active travel than to
    escorted active travel, we conclude with a call for strategies that not only
    facilitate active travel to school, but also enable children to safely
    travel independently of their parents.
