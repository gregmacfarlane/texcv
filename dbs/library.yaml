- id: voulgarisWhoseMilesAre2024
  abstract: >-
    State, local, and private-sector climate policies increasingly require
    estimates of site-generated vehicle miles traveled (VMT) for individual
    properties. No standard, agreed-upon method exists for this purpose. If
    alternative methods produce reasonably consistent results, then an analyst
    may select a method based on convenience. The purpose of this study was to
    determine whether this is the case. We reviewed existing applications and
    methods for estimating site-generated VMT, which can be conceptualized as
    the product of site-level trip generation and average length of a
    site-generated trip. We identified four plausible methods for estimating
    site-level trip generation and three for estimating average lengths of
    site-generated trips. Combining these yielded 12 methods for estimating
    site-generated VMT. We applied these methods to estimate trip generation,
    average trip length, and total VMT generated by eight existing office sites
    in the San Francisco Bay Area (CA) and the Wasatch Front Region of Utah. We
    found that trip generation and trip length estimates varied widely, with
    greater variation in trip generation estimates than in trip length
    estimates. Variation was magnified when the estimates were multiplied to
    produce site-generated VMT estimates, with the minimum estimate at a single
    site ranging from 84% to 96% lower than the corresponding maximum. In the
    short term, planning policies requiring site developers or occupants to
    produce site-level estimates of VMT should specify consistent methods to
    allow for comparison across sites and over time as needed. In the long term,
    if VMT is to be used as a performance metric, industry-wide standards for
    estimating it for both existing and prospective projects are needed.
    Alternatively, policymakers should consider whether the goals of VMT
    reduction might be better met with a different performance metric.
