- id: wangPredictingDirectionalTraffic2024
  abstract: >-
    Automated traffic signal performance measures (ATSPM) have become widely
    adopted and utilized by state and local agencies in the U.S. for collecting
    real-time traffic data 24 h a day, 7 days a week. These agencies have
    developed new performance measures and applications to address their local
    transportation planning needs. However, recent research has identified data
    quality issues in the collected data from ATSPM systems. Specifically, the
    traffic volumes collected through ATSPM exhibit data anomalies that do not
    accurately reflect the actual traffic patterns at intersections. As such,
    there is a need to address the data quality issues found in ATSPM datasets.
    The purpose of this paper is to evaluate the use of machine learning
    algorithms and statistical methods to predict traffic volume at
    intersections. Existing traffic volume data, along with additional metrics
    such as timestamps, weather conditions, crash data, and holidays, are
    evaluated to predict traffic volume and address the data anomalies present
    in ATSPM datasets. Two statistical methods and four machine learning
    algorithms are evaluated to determine their ability to predict traffic
    volumes. By comparing the root mean square error (RMSE) and the mean
    absolute percentage error (MAPE) between each model, the results demonstrate
    that the long short-term memory (LSTM) model exhibits the lowest error in
    predicting traffic volume compared with the other models. The LSTM model
    achieves an RMSE as low as 9.4 vehicles and an MAPE as low as 35%. By
    leveraging the LSTM model, traffic agencies can enhance the quality of their
    ATSPM data, enabling better decision-making for traffic operations by their
    engineers and planners.
