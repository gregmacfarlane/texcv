- id: macfarlaneDelayUnderestimationFree2011
  abstract: >-
    To quantify the effect of unnecessary motorist hesitation in free right-turn
    channels and its impact on engineering delay models, the authors observed
    peak-hour operations at two free right-turn channelized intersections in
    Utah County, Utah. Regression analysis demonstrated that perceived vehicle
    conflicts would significantly increase individual vehicle delay at free
    right-turn channels, and that existing traffic prediction models did not
    adequately describe this delay. On average, motorists yield about 2seconds
    for each conflicting vehicle. This finding raises questions about the
    validity of current delay assumptions for free rightturn channels, or
    indicates the driving public may need more adequate signage. © 2011
    Published by Elsevier Ltd.
