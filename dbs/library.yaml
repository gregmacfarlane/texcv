- id: macfarlaneModelingImpactsPark2021
  abstract: >-
    Recent research has underscored the potential for public green spaces to
    influence individual and societal health outcomes, but empirical
    measurements of such influences have yielded mixed results to date, with
    particular disagreement surrounding how access to parks ought to be defined
    while controlling for alternate explanations. In this paper, we apply a
    comprehensive measure of park accessibility drawn from random utility choice
    theory, which avoids arbitrary assertions of proximity while incorporating
    potentially numerous amenities and attributes of both the parks and the
    population. We apply this utility-based accessibility measure to correlate
    Census tract-level obesity and physical activity rate estimates from the
    Centers for Disease Control and Prevention’s 500 Cities project with
    tract-level American Community Survey socioeconomic data in New York City,
    paired with geographic open space data from New York City. Controlling for
    the socioeconomic variables and spatially correlated error terms, we show a
    positive and significant relationship between park access and physical
    activity rates. The data also suggest a negative relationship between park
    access and obesity rates, beyond what is expected through physical activity
    and socioeconomics. In doing so, this research contributes a more
    comprehensive modeling approach for measuring the impact of park access on
    health, and may improve our understanding of the role parks and access to
    them can serve in furthering public health objectives.
