- id: schultzEvaluatingQualitySignal2020
  abstract: >-
    The Utah Department of Transportation (UDOT) has taken an active role in
    evaluating and monitoring traffic signal performance throughout the state of
    Utah. Automated traffic signal performance measures (ATSPM) have been
    adopted to collect data concerning the current and historical performance of
    signalized intersections to optimize mobility and manage traffic signal
    timing and maintenance to reduce congestion, save fuel costs, and improve
    safety. The collected and aggregated data that are continuously generated
    yields approximately 1 TB of data per month. The purpose of this research
    was to provide a method that can evaluate intersection-level and
    corridor-level performance using the ATSPM data. The method described in
    this paper analyzed three signalized corridors in Utah, consisting of 22
    total intersections. Four ATSPM were used to develop threshold values. These
    performance measures include Platoon Ratio, Split Failures, Arrivals on
    Green, and Red-Light Actuation. These four performance measures are scaled
    and classified using k-means cluster analysis. The k-means cluster analysis
    is a broad set of techniques for finding subgroups of observations within a
    data set. The results of this analysis produced a score for each
    intersection and corridor determined from the weighted average of the four
    measures. The methodology can be developed with more performance types and
    more extensive corridors for future studies.
