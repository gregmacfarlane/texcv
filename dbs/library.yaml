- id: jarvisSimulatingIncidentManagement2024
  abstract: >-
    Recent research has shown the power of large-scale regional traffic
    simulations—such as MATSim—to model the systemic impacts and costs of
    capacity-reducing incidents. At the same time, observational studies have
    illustrated the potential for traffic Incident Management Teams (IMTs) to
    reduce these impacts and costs on a local scale; mathematical optimization
    models have also attempted to scale or locate these programs. In this
    research, we connect these two separate lines of scholarly inquiry by
    simulating the dynamic response of an IMT fleet to incidents arising on a
    metropolitan highway network. We introduce a MATSim module that handles
    stochastically-generated incidents of varying severity, dispatches IMT to
    clear the incidents based on path distance and availability, and measures
    excess user costs based on the incidents. We apply this module in a scenario
    with data from the Salt Lake City, Utah metropolitan region. We demonstrate
    the potential use of the module through an illustrative experiment
    increasing the IMT fleet size with a collection of simulated incident days.
