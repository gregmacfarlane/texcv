notice: Throughout this document, work completed since my promotion to associate professor appears in blue.

publication-notes:
  peer: >-
    First author or first faculty author on 12 of 21 total journal articles,
    indicating primary responsibility for the work. Paper 1 came from my
    undergraduate work, papers 2 through 6 were from my doctoral research, and
    papers 7 onward represent work completed during my time on the faculty at
    BYU. Citation counts are from Google Scholar as of August 2025. Notes on the
    venues where I publish, including impact factors and rankings, follow the
    publication lists.
  conference: >-
    Papers 1 and 2 resulted from my undergraduate honors thesis, and subsequent work from
    my time on the faculty at BYU.
  reports: >-
    These are technical reports completed under contract for the sponsoring
    agency; each report was reviewed by a technical advisory committee prior to
    publication. Item 1 resulted from postdoctoral activities at Georgia Tech,
    items 2 from my consulting practice, and items 3 through the present
    from my work since joining BYU.

